services:
  - type: web
    name: wanderer-game
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: WANDERER_DEMO_MODE
        value: offline
      - key: WANDERER_DATABASE_PATH
        value: data/sessions.db
      # Configure these privately in Render; the TTS host runs independently.
      - key: WANDERER_TTS_ENABLED
        value: "true"
      - key: WANDERER_TTS_API_URL
        value: https://studio-ianelsewhere-wanderer-voice.api-inference.modelscope.net/tts
      - key: WANDERER_TTS_REFERENCE_AUDIO
        value: wanderer.wav
      - key: WANDERER_TTS_PROMPT_TEXT
        value: 可别让我失望.这世上没有纯粹的自由.
      - key: WANDERER_TTS_TIMEOUT
        value: "240"
      - key: WANDERER_TTS_API_TOKEN
        sync: false

name: Wanderer Game Tests

on:
  push:
    paths:
      - "wanderer-game/**"
      - ".github/workflows/wanderer-game-tests.yml"
  pull_request:
    paths:
      - "wanderer-game/**"
      - ".github/workflows/wanderer-game-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wanderer-game
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run Python tests
        run: python -m pytest tests -q --basetemp=.pytest-basetemp-ci
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Check frontend JavaScript
        run: node --check frontend/app.js
      - name: Run frontend behavior tests
        run: node --test tests/frontend_behavior.test.cjs

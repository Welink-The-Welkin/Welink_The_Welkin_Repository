name: Zongce Alert Tests

on:
  push:
    paths:
      - "zongce-alert/**"
      - ".github/workflows/zongce-alert-tests.yml"
  pull_request:
    paths:
      - "zongce-alert/**"
      - ".github/workflows/zongce-alert-tests.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    # 必须用 Windows：代码依赖 winsound、pywin32、tkinter、os.startfile
    runs-on: windows-latest
    defaults:
      run:
        working-directory: zongce-alert
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[tray,dev]"

      - name: Verify all modules compile
        run: python -m compileall -q src run.py check.py startup.py start_tunnel.py

      - name: Run tests
        # GitHub 的 Windows 运行器默认用 cp1252 输出，遇到脚本里的中文提示会抛
        # UnicodeEncodeError；这里只把测试进程的输出编码固定为 UTF-8。
        env:
          PYTHONIOENCODING: utf-8
        run: python -m unittest discover -s tests -v

      - name: Verify no secrets committed
        shell: pwsh
        run: |
          $bad = @("secrets.local.json", "data")
          foreach ($item in $bad) {
            if (Test-Path $item) {
              Write-Error "Should not be committed: $item"
              exit 1
            }
          }
          Write-Host "No secrets or runtime data found in tree."
